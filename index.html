<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>شطرنج تيليجرام الاحترافية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { 
            --primary-color: #2563eb; 
            --dark-color: #1e40af; 
        }
        
        /* خلفية الشاشة المتحركة بالكامل */
        body { 
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(-45deg, #0f172a, #1e3a8a, #020617, #172554);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite;
            color: #fff; 
            text-align: center; margin: 0; padding: 10px; 
            overflow: hidden; 
            user-select: none; -webkit-user-select: none;
        }
        @keyframes gradientBG { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 95vh; position: relative; overflow: hidden; }
        
        .floating-piece { position: absolute; color: rgba(255, 255, 255, 0.04); font-size: 100px; animation: floatUp 15s linear infinite; z-index: -1; }
        .p1 { left: 10%; animation-duration: 18s; animation-delay: 0s; }
        .p2 { left: 50%; font-size: 140px; animation-duration: 22s; animation-delay: 5s; }
        .p3 { left: 80%; animation-duration: 16s; animation-delay: 2s; }
        @keyframes floatUp { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; } }

        .setup-box {
            background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(15px); 
            padding: 35px 25px; border-radius: 25px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8); width: 85%; max-width: 320px;
            border: 1px solid rgba(37, 99, 235, 0.4);
        }
        .logo-icon { font-size: 60px; margin-bottom: 0px; color: var(--primary-color); text-shadow: 0 0 20px rgba(37, 99, 235, 0.8); }
        .logo-text { font-size: 30px; font-weight: 900; margin-bottom: 25px; color: #fff; letter-spacing: 1px;}
        
        /* القائمة المنسدلة الدائرية */
        select { 
            background: rgba(0,0,0,0.6); color: #fff; border: 2px solid rgba(255,255,255,0.1); 
            padding: 10px 20px; font-size: 16px; font-family: 'Cairo', sans-serif; font-weight: 700;
            border-radius: 50px; margin: 15px 0 25px; width: 100%; outline: none; cursor: pointer;
            transition: 0.3s; box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        select:focus { border-color: var(--primary-color); background: rgba(0,0,0,0.8); }
        
        /* الأزرار الدائرية الصغيرة والاحترافية */
        .main-btn { 
            background: var(--primary-color); color: white; 
            border: none; padding: 10px 25px; font-size: 18px; font-weight: 900; font-family: 'Cairo', sans-serif;
            border-radius: 50px; cursor: pointer; 
            box-shadow: 0 5px 0 var(--dark-color), 0 10px 20px rgba(37, 99, 235, 0.5); 
            width: 90%; transition: 0.1s; letter-spacing: 0.5px; margin: 0 auto; display: block;
        }
        .main-btn:active { transform: translateY(5px); box-shadow: 0 0 0 var(--dark-color); }
        
        #game-screen { display: none; }
        
        #board { 
            width: 100%; max-width: 400px; margin: 10px auto; border-radius: 8px; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            touch-action: none; -webkit-touch-callout: none; position: relative;
        }
        
        .player-info { 
            display: flex; flex-direction: column; justify-content: space-between; align-items: stretch; 
            padding: 10px 15px; border-radius: 16px; 
            max-width: 380px; margin: 5px auto; font-weight: 700; font-size: 16px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); transition: all 0.3s ease;
        }
        .player-header { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        
        /* القطع المأكولة الدائمة والعالية الدقة */
        .captured-pieces { display: flex; flex-wrap: wrap; gap: 3px; justify-content: flex-start; margin-top: 5px; min-height: 24px; padding-left: 48px; }
        .captured-pieces img { width: 22px; height: 22px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.7)); }
        
        .player-white { background: rgba(255,255,255,0.95); color: #111; border-right: 6px solid #fff; }
        .player-white .timer { background: #111; color: #fff; }

        .player-black { background: rgba(20,20,20,0.9); color: #fff; border-right: 6px solid #111; border: 1px solid #333; }
        .player-black .timer { background: #111; color: #fff; border: 1px solid #444;}
        
        .player-details { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #666; background-color: #1e1c19; }
        
        .timer { padding: 4px 12px; border-radius: 50px; font-size: 18px; font-weight: 900; letter-spacing: 1px; }
        
        .action-buttons { display: flex; justify-content: center; gap: 10px; margin-top: 15px; max-width: 380px; margin-left: auto; margin-right: auto; }
        .btn-resign { background: #dc2626; box-shadow: 0 5px 0 #991b1b; padding: 10px 20px;}

        /* التأثيرات الأسطورية */
        .yellow-highlight { background-color: rgba(255, 255, 51, 0.5) !important; }
        .red-highlight { background-color: rgba(220, 38, 38, 0.9) !important; transition: background-color 0.2s; }
        .eval-brilliant-bg { background-color: rgba(45, 212, 191, 0.6) !important; box-shadow: inset 0 0 20px rgba(255,255,255,0.6); }
        .eval-great-bg { background-color: rgba(59, 130, 246, 0.7) !important; box-shadow: inset 0 0 15px rgba(255,255,255,0.3); }
        .eval-blunder-bg { background-color: rgba(220, 38, 38, 0.8) !important; animation: shake 0.3s; }
        .error-flash { background-color: rgba(255, 0, 0, 0.6) !important; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-4px); } 100% { transform: translateX(0); } }

        .evaluation-icon {
            position: absolute; top: -6px; right: -6px; width: 24px; height: 24px;
            color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 900; z-index: 100; border: 2px solid white; box-shadow: 0 3px 6px rgba(0,0,0,0.5);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .icon-brilliant { background-color: #0d9488; } .icon-great { background-color: #2563eb; } .icon-blunder { background-color: #dc2626; } 
        
        .highlight-dot { width: 30%; height: 30%; background: rgba(0, 0, 0, 0.35); border-radius: 50%; position: absolute; top: 35%; left: 35%; pointer-events: none; }
        .highlight-capture { width: 100%; height: 100%; box-sizing: border-box; box-shadow: inset 0 0 0 6px rgba(220, 38, 38, 0.8); border-radius: 50%; position: absolute; top: 0; left: 0; pointer-events: none; }
        .surrender-flag { position: absolute; top: -15px; right: -5px; font-size: 28px; z-index: 100; filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.8)); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(6px); }
        .modal-content { background: rgba(15, 23, 42, 0.95); padding: 35px 25px; border-radius: 30px; text-align: center; box-shadow: 0 15px 50px rgba(0,0,0,0.9); width: 85%; max-width: 330px; border: 1px solid rgba(37,99,235,0.4); animation: popIn 0.3s ease-out forwards; border-top: 6px solid var(--primary-color); }
        @keyframes popIn { 0% { transform: scale(0.5); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .modal-title { font-size: 28px; font-weight: 900; color: #fff; margin-bottom: 8px; font-family: 'Cairo', sans-serif;}
        .modal-text { font-size: 16px; font-weight: 700; margin-bottom: 30px; color: #94a3b8; }
        
        .modal-buttons { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .modal-btn { flex: 1; padding: 10px 10px; font-size: 16px; font-weight: 900; font-family: 'Cairo', sans-serif; border-radius: 50px; cursor: pointer; border: none; transition: 0.1s; }
        .btn-play-again { background: var(--primary-color); color: white; box-shadow: 0 5px 0 var(--dark-color); }
        .btn-play-again:active { transform: translateY(5px); box-shadow: none; }
        .btn-exit { background: #334155; color: white; box-shadow: 0 5px 0 #0f172a; }
        .btn-exit:active { transform: translateY(5px); box-shadow: none; }

        /* ستايل نافذة اختيار ترقية الجندي */
        .promotion-box { background: rgba(15,23,42,0.95); padding: 25px; border-radius: 25px; display: flex; flex-direction: column; align-items: center; border: 2px solid var(--primary-color); box-shadow: 0 20px 50px rgba(0,0,0,0.9); }
        .promotion-title { font-size: 20px; font-weight: 900; color: white; margin-bottom: 20px; }
        .promo-pieces-row { display: flex; gap: 15px; }
        .promo-piece { width: 65px; height: 65px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; border: 2px solid transparent; }
        .promo-piece:active { transform: scale(1.1); background: var(--primary-color); border-color: white; }
        .promo-piece img { width: 55px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6)); }
    </style>
</head>
<body>
    <div id="setup-screen">
        <div class="floating-piece p1">♞</div>
        <div class="floating-piece p2">♛</div>
        <div class="floating-piece p3">♜</div>
        <div class="setup-box">
            <div class="logo-icon">♟️</div>
            <div class="logo-text">شطرنج</div>
            <p style="color: #94a3b8; font-size: 15px; font-weight: 700; margin-bottom: 15px;">العب بأسلوب عالمي</p>
            <select id="time-limit">
                <option value="0">بدون وقت (مفتوح)</option>
                <option value="1">1 دقيقة (رصاصة)</option>
                <option value="3">3 دقائق (سريع)</option>
                <option value="5" selected>5 دقائق (خاطف)</option>
                <option value="10">10 دقائق (كلاسيك)</option>
            </select>
            <button class="main-btn" onclick="startGame()">العب الآن</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="player-info" id="opponent-info">
            <div class="player-header">
                <div class="player-details">
                    <img id="opponent-photo" class="avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
                    <span id="opponent-name">الخصم (ينتظر...)</span>
                </div>
                <div class="timer" id="opponent-timer">--:--</div>
            </div>
            <div class="captured-pieces" id="opponent-captured"></div>
        </div>
        
        <div id="board"></div>
        
        <div class="player-info" id="my-info">
            <div class="player-header">
                <div class="player-details">
                    <img id="my-photo" class="avatar" src="https://cdn-icons-png.flaticon.com/512/149/149071.png">
                    <span id="my-name">أنت</span>
                </div>
                <div class="timer" id="my-timer">--:--</div>
            </div>
            <div class="captured-pieces" id="my-captured"></div>
        </div>
        
        <div class="action-buttons">
            <button class="main-btn" id="invite-btn" onclick="inviteFriend()" style="display:none; margin:0;">أرسل دعوة لأصدقائك</button>
            <button class="main-btn btn-resign" id="resign-btn" onclick="resignGame()" style="display:none; width:auto;">انسحاب 🏳️</button>
        </div>
        <div id="game-status" style="margin-top: 15px; color: var(--primary-color); font-weight: 900; font-size: 18px;">بانتظار الخصم...</div>
    </div>

    <div class="modal-overlay" id="game-over-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-result-title">النتيجة</div>
            <div class="modal-text" id="modal-result-text">انتهت اللعبة</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-play-again" onclick="location.reload()">لعب مجدداً</button>
                <button class="modal-btn btn-exit" onclick="returnToMain()">خروج</button>
            </div>
        </div>
    </div>

    <!-- نافذة الترقية -->
    <div class="modal-overlay" id="promotion-modal">
        <div class="promotion-box">
            <div class="promotion-title">اختر قطعة للترقية 👑</div>
            <div class="promo-pieces-row" id="promo-options"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = { apiKey: "AIzaSyAwUcJMBbkq13inccYMGIWgK0RM8Ix5jw4", authDomain: "chessgame-c7428.firebaseapp.com", databaseURL: "https://chessgame-c7428-default-rtdb.firebaseio.com", projectId: "chessgame-c7428", storageBucket: "chessgame-c7428.firebasestorage.app", messagingSenderId: "309707784183", appId: "1:309707784183:web:200d14274c27e7203cb8f2" };
        const app = initializeApp(firebaseConfig); const db = getDatabase(app);
        
        const tg = window.Telegram.WebApp; tg.expand(); 
        const user = tg.initDataUnsafe?.user || {};
        const userName = user.first_name || "لاعب تيليجرام";
        const defaultAvatar = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        const userPhoto = user.photo_url || defaultAvatar; // الحماية من اختفاء الصورة

        const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');
        const checkSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-check.mp3');
        const errorSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/illegal.mp3'); 
        const brilliantSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/promote.mp3'); 
        const greatSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/notify.mp3'); 
        const gameStartSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/game-start.mp3');
        const gameEndSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/game-end.mp3');

        let board = null; let game = new Chess(); let roomId = null;
        let myRole = 'w'; let gameRef = null; let timerInterval = null; let opponentJoined = false;
        let localWTime = 0; let localBTime = 0; let timeLimitGame = 0; let dataCache = {};
        let selectedTapSquare = null; let pendingPromotion = null;
        const pieceOrder = { p: 1, n: 3, b: 3, r: 5, q: 9, k: 100 }; 

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) roomId = urlParams.get('room');
        else if (urlParams.has('startapp')) roomId = urlParams.get('startapp');
        else if (tg.initDataUnsafe?.start_param) roomId = tg.initDataUnsafe.start_param;

        if (roomId) { myRole = 'b'; document.getElementById('setup-screen').style.display = 'none'; document.getElementById('game-screen').style.display = 'block'; initGame(roomId); }

        window.startGame = function() {
            let selectedMinutes = parseInt(document.getElementById('time-limit').value);
            roomId = Math.random().toString(36).substring(2, 10);
            myRole = 'w'; opponentJoined = false;
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('invite-btn').style.display = 'block';
            initGame(roomId, selectedMinutes, userName);
        }

        window.resignGame = function() { if (confirm("هل أنت متأكد أنك تريد الاستسلام؟")) update(gameRef, { resigned: myRole }); }
        
        window.returnToMain = function() {
            document.getElementById('game-over-modal').style.display = 'none'; document.getElementById('setup-screen').style.display = 'flex'; document.getElementById('game-screen').style.display = 'none';
            const newUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.pushState({path:newUrl},'',newUrl); roomId = null;
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('yellow-highlight red-highlight eval-brilliant-bg eval-great-bg eval-blunder-bg error-flash');
            $('#board .square-55d63').find('.highlight-dot, .highlight-capture, .evaluation-icon').remove();
        }

        function highlightKingInCheck() {
            if (game.in_check()) {
                let turn = game.turn();
                $('#board .square-55d63').each(function() {
                    let sq = $(this).attr('data-square'); let piece = game.get(sq);
                    if (piece && piece.type === 'k' && piece.color === turn) $(this).addClass('red-highlight');
                });
            }
        }

        function triggerErrorEffect(square) {
            errorSound.play().catch(e => {}); 
            let $sq = $('#board .square-' + square);
            $sq.addClass('error-flash'); setTimeout(() => $sq.removeClass('error-flash'), 300);
        }

        function showGameOver(title, message) {
            gameEndSound.play().catch(e=>{});
            document.getElementById('modal-result-title').innerText = title;
            document.getElementById('modal-result-text').innerText = message;
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        function updateCapturedPieces() {
            let history = game.history({ verbose: true });
            let wCaptured = []; let bCaptured = [];
            history.forEach(move => {
                if (move.captured) {
                    if (move.color === 'w') wCaptured.push(move.captured.toLowerCase());
                    else bCaptured.push(move.captured.toLowerCase());
                }
            });
            wCaptured.sort((a, b) => pieceOrder[a] - pieceOrder[b]);
            bCaptured.sort((a, b) => pieceOrder[a] - pieceOrder[b]);
            
            let wHtml = wCaptured.map(p => `<img src="https://images.chesscomfiles.com/chess-themes/pieces/neo/150/b${p}.png">`).join('');
            let bHtml = bCaptured.map(p => `<img src="https://images.chesscomfiles.com/chess-themes/pieces/neo/150/w${p}.png">`).join('');
            
            if (myRole === 'w') { $('#my-captured').html(wHtml); $('#opponent-captured').html(bHtml); } 
            else { $('#my-captured').html(bHtml); $('#opponent-captured').html(wHtml); }
        }

        function showPromotionModal(source, target) {
            pendingPromotion = { source, target };
            let color = myRole; let pieces = ['q', 'r', 'b', 'n'];
            let html = pieces.map(p => `<div class="promo-piece" onclick="choosePromotion('${p}')"><img src="https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${color}${p}.png"></div>`).join('');
            document.getElementById('promo-options').innerHTML = html;
            document.getElementById('promotion-modal').style.display = 'flex';
        }

        window.choosePromotion = function(promoPiece) {
            document.getElementById('promotion-modal').style.display = 'none';
            if (pendingPromotion) { executeMove(pendingPromotion.source, pendingPromotion.target, promoPiece); pendingPromotion = null; }
        }
                    function executeMove(source, target, promo = 'q') {
            var move = game.move({ from: source, to: target, promotion: promo });
            if (move === null) return false; 
            
            board.position(game.fen(), false); 
            removeHighlights(); 

            let moveEvalType = 'normal';
            let movedVal = pieceOrder[move.piece];
            let capturedVal = move.captured ? pieceOrder[move.captured] : 0;

            if (game.in_checkmate() || (move.promotion && game.in_check())) moveEvalType = 'brilliant'; 
            else if (move.captured && capturedVal > movedVal) moveEvalType = 'great'; 
            else if (move.captured === 'q') moveEvalType = 'great'; 

            if (moveEvalType === 'normal' && movedVal > 1) {
                let isThreatenedByLesser = false;
                let nextMoves = game.moves({ verbose: true });
                for (let i = 0; i < nextMoves.length; i++) {
                    if (nextMoves[i].to === target && (pieceOrder[nextMoves[i].piece] < movedVal || move.piece === 'q')) {
                        isThreatenedByLesser = true; break;
                    }
                }
                if (isThreatenedByLesser) moveEvalType = 'blunder'; 
            }

            let $targetSquare = $('#board .square-' + target);

            if (moveEvalType === 'brilliant') {
                brilliantSound.play().catch(e=>{});
                $targetSquare.addClass('eval-brilliant-bg').append('<div class="evaluation-icon icon-brilliant">!!</div>');
            } else if (moveEvalType === 'great') {
                greatSound.play().catch(e=>{});
                $targetSquare.addClass('eval-great-bg').append('<div class="evaluation-icon icon-great">!</div>');
            } else if (moveEvalType === 'blunder') {
                errorSound.play().catch(e=>{});
                $targetSquare.addClass('eval-blunder-bg').append('<div class="evaluation-icon icon-blunder">?</div>');
            } else {
                if (move.captured) captureSound.play().catch(e=>{}); else moveSound.play().catch(e=>{});
            }

            highlightKingInCheck(); updateCapturedPieces(); checkGameStatus();

            set(gameRef, { 
                fen: game.fen(), turn: game.turn(), wTime: localWTime, bTime: localBTime,
                wName: dataCache.wName || '', bName: dataCache.bName || '',
                wPhoto: dataCache.wPhoto || '', bPhoto: dataCache.bPhoto || '',
                timeLimit: timeLimitGame, resigned: dataCache.resigned || null,
                lastMoveTo: target, lastMoveType: moveEvalType
            });
            return true;
        }

        function checkGameStatus() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                if (game.in_checkmate()) {
                    let winnerName = game.turn() === 'w' ? (dataCache.bName || 'الأسود') : (dataCache.wName || 'الأبيض');
                    showGameOver("فاز " + winnerName, "بواسطة كش مات 🏆");
                } else if (game.in_stalemate()) { showGameOver("تعادل", "خنق الملك (Stalemate) 🤝");
                } else if (game.in_threefold_repetition()) { showGameOver("تعادل", "تكرار الوضع 3 مرات 🤝");
                } else if (game.insufficient_material()) { showGameOver("تعادل", "نقص القطع لإحداث مات 🤝");
                } else { showGameOver("تعادل", "قاعدة الـ 50 نقلة 🤝"); }
                return true;
            }
            return false;
        }

        function startLocalClock() {
            clearInterval(timerInterval);
            if (timeLimitGame <= 0 || dataCache.resigned) return; 
            timerInterval = setInterval(() => {
                if (!opponentJoined || game.game_over() || dataCache.resigned) return;
                if (game.turn() === 'w') { if (localWTime > 0) localWTime--; } else { if (localBTime > 0) localBTime--; }
                updateTimersUI(localWTime, localBTime);
                if (localWTime <= 0 || localBTime <= 0) {
                    clearInterval(timerInterval);
                    let winnerName = localWTime <= 0 ? (dataCache.bName || 'الأسود') : (dataCache.wName || 'الأبيض');
                    showGameOver("فاز " + winnerName, "بسبب نفاد الوقت ⏱️");
                }
            }, 1000);
        }

        function initGame(id, minutes = 0, creatorName = "") {
            gameRef = ref(db, 'rooms/' + id);
            
            if (myRole === 'w') {
                $('#my-info').addClass('player-white').removeClass('player-black'); $('#opponent-info').addClass('player-black').removeClass('player-white');
            } else {
                $('#my-info').addClass('player-black').removeClass('player-white'); $('#opponent-info').addClass('player-white').removeClass('player-black');
            }

            document.getElementById('my-name').innerText = userName; document.getElementById('my-photo').src = userPhoto;
            
            if (myRole === 'w') {
                let seconds = minutes * 60;
                set(gameRef, { 
                    fen: game.fen(), timeLimit: seconds, wTime: seconds, bTime: seconds,
                    wName: userName, wPhoto: userPhoto, turn: 'w', resigned: null, lastMoveTo: null, lastMoveType: 'normal'
                });
            } else { 
                update(gameRef, { bName: userName, bPhoto: userPhoto }); 
            }

            var config = {
                position: 'start', draggable: true, dropOffBoard: 'snapback', moveSpeed: 100, snapbackSpeed: 100, snapSpeed: 100,
                pieceTheme: function(piece) { return `https://images.chesscomfiles.com/chess-themes/pieces/neo/150/${piece.toLowerCase()}.png`; },
                orientation: myRole === 'b' ? 'black' : 'white',
                onDragStart: function(source, piece) {
                    if (!opponentJoined || game.game_over() || dataCache.resigned) return false;
                    if (piece.search(myRole === 'w' ? /^b/ : /^w/) !== -1) return false;
                    removeHighlights(); selectedTapSquare = source;
                    $('#board .square-' + source).addClass('yellow-highlight');
                    var moves = game.moves({ square: source, verbose: true });
                    for (var i = 0; i < moves.length; i++) {
                        var isCapture = game.get(moves[i].to) !== null;
                        var $sq = $('#board .square-' + moves[i].to);
                        if (isCapture) $sq.append('<div class="highlight-capture"></div>'); else $sq.append('<div class="highlight-dot"></div>');
                    }
                },
                onDrop: function(source, target) {
                    removeHighlights();
                    if (game.turn() !== myRole) { triggerErrorEffect(source); selectedTapSquare = null; return 'snapback'; }
                    let moves = game.moves({verbose: true});
                    let isPromo = moves.some(m => m.from === source && m.to === target && m.flags.includes('p'));
                    if (isPromo) { showPromotionModal(source, target); return 'snapback'; }
                    let success = executeMove(source, target);
                    if (!success) { selectedTapSquare = null; return 'snapback'; }
                    selectedTapSquare = null;
                }
            };
            board = Chessboard('board', config);

            $('#board').on('touchstart mousedown', '.square-55d63', function(e) {
                if (!opponentJoined || game.game_over() || dataCache.resigned) return;
                if (e.type === 'mousedown' && ('ontouchstart' in window)) return;
                var clickedSquare = $(this).attr('data-square');
                
                if (selectedTapSquare && selectedTapSquare !== clickedSquare && game.turn() === myRole) {
                    var moves = game.moves({ verbose: true });
                    var moveObj = moves.find(m => m.from === selectedTapSquare && m.to === clickedSquare);
                    if (moveObj) {
                        e.preventDefault(); 
                        if (moveObj.flags.includes('p')) { showPromotionModal(selectedTapSquare, clickedSquare); return; }
                        let success = executeMove(selectedTapSquare, clickedSquare);
                        if (success) { removeHighlights(); selectedTapSquare = null; return; }
                    }
                }
                
                var piece = game.get(clickedSquare);
                if (piece && piece.color === myRole) {
                    removeHighlights(); selectedTapSquare = clickedSquare;
                    $(this).addClass('yellow-highlight');
                    var moves = game.moves({ square: clickedSquare, verbose: true });
                    for (var i = 0; i < moves.length; i++) {
                        var isCapture = game.get(moves[i].to) !== null;
                        var $sq = $('#board .square-' + moves[i].to);
                        if (isCapture) $sq.append('<div class="highlight-capture"></div>'); else $sq.append('<div class="highlight-dot"></div>');
                    }
                } else { removeHighlights(); selectedTapSquare = null; highlightKingInCheck(); }
            });

            onValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    dataCache = data; timeLimitGame = data.timeLimit;
                    
                    if (data.resigned) {
                        clearInterval(timerInterval);
                        let winnerName = data.resigned === 'w' ? (data.bName || 'الأسود') : (data.wName || 'الأبيض');
                        $('#board .square-55d63').each(function() {
                            let sq = $(this).attr('data-square'); let piece = game.get(sq);
                            if (piece && piece.type === 'k' && piece.color === data.resigned) {
                                if ($(this).find('.surrender-flag').length === 0) $(this).append('<div class="surrender-flag">🏳️</div>');
                            }
                        });
                        setTimeout(() => showGameOver("فاز " + winnerName, "بسبب انسحاب الخصم 🏳️"), 1000);
                        return;
                    }

                    if (data.fen !== game.fen()) {
                        game.load(data.fen); board.position(data.fen); removeHighlights();
                        let isCheck = game.in_check(); let isMyTurnNow = (game.turn() === myRole); 
                        if (isMyTurnNow) {
                            if (isCheck) checkSound.play().catch(e=>{});
                            else {
                                if (data.lastMoveType === 'brilliant') brilliantSound.play().catch(e=>{});
                                else if (data.lastMoveType === 'great') greatSound.play().catch(e=>{});
                                else if (data.lastMoveType === 'blunder') errorSound.play().catch(e=>{});
                                else if (game.history({verbose:true}).pop()?.captured) captureSound.play().catch(e=>{});
                                else moveSound.play().catch(e=>{});
                            }
                        }
                        
                        if (data.lastMoveTo && data.lastMoveType && data.lastMoveType !== 'normal') {
                            let $lastSquare = $('#board .square-' + data.lastMoveTo);
                            if (data.lastMoveType === 'brilliant') {
                                $lastSquare.addClass('eval-brilliant-bg');
                                if ($lastSquare.find('.evaluation-icon').length === 0) $lastSquare.append('<div class="evaluation-icon icon-brilliant">!!</div>');
                            } else if (data.lastMoveType === 'great') {
                                $lastSquare.addClass('eval-great-bg');
                                if ($lastSquare.find('.evaluation-icon').length === 0) $lastSquare.append('<div class="evaluation-icon icon-great">!</div>');
                            } else if (data.lastMoveType === 'blunder') {
                                $lastSquare.addClass('eval-blunder-bg');
                                if ($lastSquare.find('.evaluation-icon').length === 0) $lastSquare.append('<div class="evaluation-icon icon-blunder">?</div>');
                            }
                        }
                        
                        highlightKingInCheck(); updateCapturedPieces(); checkGameStatus();
                        localWTime = data.wTime; localBTime = data.bTime;
                    } else if (localWTime === 0 && localBTime === 0 && data.timeLimit > 0) {
                        localWTime = data.wTime; localBTime = data.bTime;
                    }
                    
                    updateTimersUI(localWTime, localBTime);
                    
                    // التزامن الجذري للصورة والاسم (مستحيل يختفوا الآن)
                    if (data.wName || data.bName) {
                        let oppName = myRole === 'w' ? (data.bName || "الخصم يجهز...") : (data.wName || "الخصم يجهز...");
                        let oppPhoto = myRole === 'w' ? (data.bPhoto || defaultAvatar) : (data.wPhoto || defaultAvatar);
                        
                        $('#opponent-name').text(oppName).css("color", myRole === 'w' ? "#94a3b8" : "#111");
                        $('#opponent-photo').attr('src', oppPhoto);
                        
                        if (data.wName && data.bName && !opponentJoined) {
                            opponentJoined = true;
                            gameStartSound.play().catch(e=>{}); 
                            $('#game-status').text('بدأت المعركة! ⚔️');
                            $('#invite-btn').hide(); $('#resign-btn').show(); 
                            startLocalClock(); 
                        }
                    }
                }
            });
        }

        function updateTimersUI(wTime, bTime) {
            if (timeLimitGame <= 0) { $('#my-timer').text('--:--'); $('#opponent-timer').text('--:--'); return; }
            function format(sec) {
                if (sec < 0) sec = 0; let m = Math.floor(sec / 60), s = sec % 60;
                return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
            }
            if (myRole === 'w') { document.getElementById('my-timer').innerText = format(wTime); document.getElementById('opponent-timer').innerText = format(bTime); } 
            else { document.getElementById('my-timer').innerText = format(bTime); document.getElementById('opponent-timer').innerText = format(wTime); }
        }

        window.inviteFriend = function() {
            let gameUrl = `https://diaaldin12015-png.github.io/chess/?room=${roomId}`;
            let shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=أتحداك في جيم شطرنج احترافي! ادخل العب معي الآن ♟️`;
            tg.openTelegramLink(shareUrl);
        }
    </script>
