<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>شطرنج تيليجرام</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root {
            color-scheme: light;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: #12121a; color: #fff; 
            text-align: center; margin: 0; padding: 10px; 
            overflow: hidden; 
        }
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 90vh; }
        .logo-text { font-size: 40px; font-weight: bold; margin-bottom: 20px; color: #ffca28; }
        select { 
            background: #2a2a40; color: #fff; border: 1px solid #4e54c8; 
            padding: 10px; font-size: 16px; border-radius: 8px; margin: 15px 0; width: 200px;
        }
        .main-btn { 
            background: linear-gradient(135deg, #4e54c8, #8f94fb); color: white; 
            border: none; padding: 15px 30px; font-size: 18px; font-weight: bold;
            border-radius: 10px; cursor: pointer; box-shadow: 0 5px 15px rgba(78,84,200,0.4);
            width: 200px;
        }
        
        #game-screen { display: none; }
        #board { width: 100%; max-width: 400px; margin: 10px auto; border-radius: 5px; box-shadow: 0 0 15px rgba(0,0,0,0.8); }
        .player-info { 
            display: flex; justify-content: space-between; align-items: center; 
            background: #2a2a40; padding: 10px 15px; border-radius: 8px; 
            max-width: 370px; margin: 5px auto; font-weight: bold;
        }
        .timer { background: #1e1e2f; padding: 5px 10px; border-radius: 5px; color: #ffca28; font-size: 18px; }
        #invite-btn { margin-top: 15px; background: #25d366; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="logo-text">شطرنج</div>
        <p style="color: #aaa; font-size: 14px;">اختر وقت المباراة</p>
        
        <select id="time-limit">
            <option value="0">بدون وقت (مفتوح)</option>
            <option value="1">1 دقيقة (رصاصة)</option>
            <option value="3">3 دقائق (سريع)</option>
            <option value="5" selected>5 دقائق (خاطف)</option>
            <option value="10">10 دقائق (كلاسيك)</option>
        </select>
        
        <button class="main-btn" onclick="startGame()">بدء اللعب</button>
    </div>

    <div id="game-screen">
        <div class="player-info">
            <span id="opponent-name">الخصم (ينتظر...)</span>
            <div class="timer" id="black-timer">--:--</div>
        </div>
        
        <div id="board"></div>
        
        <div class="player-info">
            <span id="my-name">أنت</span>
            <div class="timer" id="white-timer">--:--</div>
        </div>

        <button class="main-btn" id="invite-btn" onclick="inviteFriend()" style="display:none;">أرسل دعوة لأصدقائك</button>
        <div id="game-status" style="margin-top: 10px; color: #4caf50; font-weight: bold;">بانتظار الخصم...</div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwUcJMBbkq13inccYMGIWgK0RM8Ix5jw4",
            authDomain: "chessgame-c7428.firebaseapp.com",
            databaseURL: "https://chessgame-c7428-default-rtdb.firebaseio.com",
            projectId: "chessgame-c7428",
            storageBucket: "chessgame-c7428.firebasestorage.app",
            messagingSenderId: "309707784183",
            appId: "1:309707784183:web:200d14274c27e7203cb8f2",
            measurementId: "G-N0JJD3WF66"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram.WebApp;
        tg.expand(); 
        const userName = tg.initDataUnsafe?.user?.first_name || "لاعب تيليجرام";

        const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');

        let board = null;
        let game = new Chess();
        
        // التقاط رقم الغرفة مباشرة من الرابط المباشر (مثل ?room=xyz)
        let roomId = null;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) {
            roomId = urlParams.get('room');
        } else if (urlParams.has('startapp')) {
            roomId = urlParams.get('startapp');
        } else if (tg.initDataUnsafe?.start_param) {
            roomId = tg.initDataUnsafe.start_param;
        }

        let myRole = 'w';
        let gameRef = null;
        
        let timerInterval = null;
        let whiteTime = 0, blackTime = 0;
        let timeEnabled = false;
        let opponentJoined = false;

        if (roomId) {
            myRole = 'b';
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            initGame(roomId);
        }

        window.startGame = function() {
            let selectedMinutes = parseInt(document.getElementById('time-limit').value);
            roomId = Math.random().toString(36).substring(2, 10);
            myRole = 'w';
            opponentJoined = false;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('invite-btn').style.display = 'inline-block';
            
            initGame(roomId, selectedMinutes, userName);
        }

        function initGame(id, minutes = 0, creatorName = "") {
            gameRef = ref(db, 'rooms/' + id);
            document.getElementById('my-name').innerText = userName + (myRole === 'w' ? ' (أبيض)' : ' (أسود)');
            
            if (myRole === 'w') {
                let seconds = minutes * 60;
                set(gameRef, { 
                    fen: game.fen(), 
                    timeLimit: seconds,
                    wTime: seconds,
                    bTime: seconds,
                    wName: creatorName,
                    turn: 'w',
                    lastMoveTime: Date.now()
                });
            } else {
                set(ref(db, 'rooms/' + id + '/bName'), userName);
            }
            var config = {
                position: 'start',
                draggable: true,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                orientation: myRole === 'b' ? 'black' : 'white',
                onDragStart: function(source, piece) {
                    if (!opponentJoined) return false;
                    if (game.game_over() || game.turn() !== myRole) return false;
                    if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
                        (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
                        return false;
                    }
                },
                onDrop: function(source, target) {
                    var move = game.move({ from: source, to: target, promotion: 'q' });
                    if (move === null) return 'snapback';
                    
                    if (move.captured) captureSound.play();
                    else moveSound.play();

                    let currentTurnTime = (myRole === 'w') ? whiteTime : blackTime;
                    set(gameRef, { 
                        fen: game.fen(),
                        turn: game.turn(),
                        wTime: myRole==='w' ? currentTurnTime : whiteTime,
                        bTime: myRole==='b' ? currentTurnTime : blackTime,
                        lastMoveTime: Date.now()
                    });
                }
            };
            board = Chessboard('board', config);

            onValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.fen !== game.fen()) {
                        game.load(data.fen);
                        board.position(data.fen);
                        moveSound.play();
                    }
                    
                    if (data.wName && data.bName) {
                        opponentJoined = true;
                        $('#game-status').text('بدأت المعركة!');
                        $('#invite-btn').hide();
                        
                        if(myRole === 'w') {
                            $('#opponent-name').text(data.bName + ' (أسود)');
                        } else {
                            $('#opponent-name').text(data.wName + ' (أبيض)');
                        }
                    }

                    timeEnabled = data.timeLimit > 0;
                    if (timeEnabled) {
                        whiteTime = data.wTime;
                        blackTime = data.bTime;
                        updateTimersUI();
                        
                        clearInterval(timerInterval);
                        if (!game.game_over() && opponentJoined) {
                            timerInterval = setInterval(() => {
                                if (data.turn === 'w') whiteTime--;
                                else blackTime--;
                                updateTimersUI();
                                
                                if (whiteTime <= 0 || blackTime <= 0) {
                                    clearInterval(timerInterval);
                                    $('#game-status').text('انتهى الوقت! ' + (whiteTime <= 0 ? 'الأسود' : 'الأبيض') + ' فاز.');
                                }
                            }, 1000);
                        }
                    } else {
                        $('#white-timer').text('--:--');
                        $('#black-timer').text('--:--');
                    }
                }
            });
        }

        function updateTimersUI() {
            function formatTime(sec) {
                if(sec < 0) sec = 0;
                let m = Math.floor(sec / 60);
                let s = sec % 60;
                return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
            }
            document.getElementById('white-timer').innerText = formatTime(whiteTime);
            document.getElementById('black-timer').innerText = formatTime(blackTime);
        }

        // تم تعديل طريقة المشاركة لتعتمد على الرابط المباشر للموقع مع رقم الغرفة
        window.inviteFriend = function() {
            let gameUrl = `https://diaaldin12015-png.github.io/chess/?room=${roomId}`;
            let shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=أتحداك في جيم شطرنج! ادخل العب معي الآن ♟️`;
            tg.openTelegramLink(shareUrl);
        }
    </script>
</body>
</html>
