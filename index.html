<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="color-scheme" content="light">
    <title>شطرنج تيليجرام</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
    
    <style>
        :root { color-scheme: light; }
        body { 
            font-family: 'Cairo', sans-serif; 
            background: #312e2b; 
            color: #fff; 
            text-align: center; margin: 0; padding: 10px; 
            overflow: hidden; 
            user-select: none;
            -webkit-user-select: none;
        }
        
        #setup-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 95vh; }
        .setup-box {
            background: #262421; padding: 40px 30px; border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); width: 85%; max-width: 350px;
        }
        .logo-icon { font-size: 60px; margin-bottom: 5px; color: #81b64c; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .logo-text { font-size: 32px; font-weight: 900; margin-bottom: 25px; color: #fff; }
        
        select { 
            background: #1e1c19; color: #fff; border: 2px solid #3d3b39; 
            padding: 12px 15px; font-size: 16px; font-family: 'Cairo', sans-serif; font-weight: 700;
            border-radius: 10px; margin: 15px 0 25px; width: 100%; outline: none; cursor: pointer;
        }
        
        .main-btn { 
            background: #81b64c; color: white; 
            border: none; padding: 15px 30px; font-size: 20px; font-weight: 900; font-family: 'Cairo', sans-serif;
            border-radius: 10px; cursor: pointer; 
            box-shadow: 0 6px 0 #537a31; width: 100%; transition: 0.1s; letter-spacing: 0.5px;
        }
        .main-btn:active { transform: translateY(6px); box-shadow: none; }
        
        #game-screen { display: none; }
        
        #board { 
            width: 100%; max-width: 400px; margin: 15px auto; border-radius: 5px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            touch-action: none; 
            -webkit-touch-callout: none;
        }
        
        .player-info { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 10px 15px; border-radius: 10px; 
            max-width: 370px; margin: 5px auto; font-weight: 700; font-size: 16px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .player-white { background: #f0f0f0; color: #111; }
        .player-white .timer { background: #111; color: #fff; }
        .player-white .player-details span { color: #111 !important; }

        .player-black { background: #262421; color: #fff; }
        .player-black .timer { background: #1a1917; color: #fff; }
        .player-black .player-details span { color: #bababa !important; }
        
        .player-details { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px; border-radius: 50%;
            object-fit: cover; border: 2px solid #888;
            background-color: #1e1c19;
        }
        
        .timer { padding: 5px 12px; border-radius: 6px; font-size: 20px; font-weight: 900; letter-spacing: 1px; }
        
        .action-buttons {
            display: flex; justify-content: center; gap: 10px; margin-top: 15px; max-width: 370px; margin-left: auto; margin-right: auto;
        }
        .btn-resign { background: #d64d4d; box-shadow: 0 5px 0 #9c3535; font-size: 18px; padding: 12px 20px; }

        .yellow-highlight { background-color: rgba(255, 255, 51, 0.5) !important; }
        .red-highlight { background-color: rgba(235, 97, 80, 0.9) !important; transition: background-color 0.2s; }
        .error-flash { background-color: rgba(255, 0, 0, 0.7) !important; }
        
        .highlight-dot {
            width: 30%; height: 30%; background: rgba(0, 0, 0, 0.25);
            border-radius: 50%; position: absolute;
            top: 35%; left: 35%; pointer-events: none;
        }
        .highlight-capture {
            width: 100%; height: 100%; box-sizing: border-box;
            box-shadow: inset 0 0 0 5px rgba(0, 0, 0, 0.25);
            border-radius: 50%; position: absolute;
            top: 0; left: 0; pointer-events: none;
        }

        .surrender-flag {
            position: absolute; top: -15px; right: -5px; font-size: 28px; z-index: 100;
            filter: drop-shadow(0px 4px 4px rgba(0,0,0,0.8));
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #game-over-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.75); justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #262421; padding: 35px 25px; border-radius: 16px; text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7); width: 85%; max-width: 350px;
            animation: popIn 0.3s ease-out forwards; border-top: 6px solid #81b64c;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-title { font-size: 26px; font-weight: 900; color: #fff; margin-bottom: 8px; font-family: 'Cairo', sans-serif;}
        .modal-text { font-size: 16px; font-weight: 700; margin-bottom: 30px; color: #bababa; }
        
        .modal-buttons { display: flex; gap: 10px; justify-content: center; width: 100%; }
        .modal-btn { flex: 1; padding: 12px 10px; font-size: 18px; font-weight: 900; font-family: 'Cairo', sans-serif; border-radius: 8px; cursor: pointer; border: none; transition: 0.1s; }
        .btn-play-again { background: #81b64c; color: white; box-shadow: 0 5px 0 #537a31; }
        .btn-play-again:active { transform: translateY(5px); box-shadow: none; }
        .btn-exit { background: #3d3b39; color: white; box-shadow: 0 5px 0 #1e1c19; }
        .btn-exit:active { transform: translateY(5px); box-shadow: none; }
    </style>
</head>
<body>

    <div id="setup-screen">
        <div class="setup-box">
            <div class="logo-icon">♟️</div>
            <div class="logo-text">شطرنج</div>
            <p style="color: #999; font-size: 15px; font-weight: 700; margin-bottom: 10px;">اختر وقت المباراة</p>
            <select id="time-limit">
                <option value="0">بدون وقت (مفتوح)</option>
                <option value="1">1 دقيقة (رصاصة)</option>
                <option value="3">3 دقائق (سريع)</option>
                <option value="5" selected>5 دقائق (خاطف)</option>
                <option value="10">10 دقائق (كلاسيك)</option>
            </select>
            <button class="main-btn" onclick="startGame()">العب الآن</button>
        </div>
    </div>

    <div id="game-screen">
        <div class="player-info" id="opponent-info">
            <div class="player-details">
                <img id="opponent-photo" class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png">
                <span id="opponent-name">الخصم (ينتظر...)</span>
            </div>
            <div class="timer" id="opponent-timer">--:--</div>
        </div>
        
        <div id="board"></div>
        
        <div class="player-info" id="my-info">
            <div class="player-details">
                <img id="my-photo" class="avatar" src="https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png">
                <span id="my-name">أنت</span>
            </div>
            <div class="timer" id="my-timer">--:--</div>
        </div>
        
        <div class="action-buttons">
            <button class="main-btn" id="invite-btn" onclick="inviteFriend()" style="display:none;">أرسل دعوة لأصدقائك</button>
            <button class="main-btn btn-resign" id="resign-btn" onclick="resignGame()" style="display:none;">انسحاب 🏳️</button>
        </div>
        <div id="game-status" style="margin-top: 15px; color: #81b64c; font-weight: 900; font-size: 18px;">بانتظار الخصم...</div>
    </div>

    <div id="game-over-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-result-title">النتيجة</div>
            <div class="modal-text" id="modal-result-text">انتهت اللعبة</div>
            <div class="modal-buttons">
                <button class="modal-btn btn-play-again" onclick="location.reload()">لعب مجدداً</button>
                <button class="modal-btn btn-exit" onclick="tg.close()">خروج</button>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://unpkg.com/chess.js@0.10.3/chess.js"></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, update, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAwUcJMBbkq13inccYMGIWgK0RM8Ix5jw4",
            authDomain: "chessgame-c7428.firebaseapp.com",
            databaseURL: "https://chessgame-c7428-default-rtdb.firebaseio.com",
            projectId: "chessgame-c7428",
            storageBucket: "chessgame-c7428.firebasestorage.app",
            messagingSenderId: "309707784183",
            appId: "1:309707784183:web:200d14274c27e7203cb8f2"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram.WebApp;
        tg.expand(); 
        
        const userName = tg.initDataUnsafe?.user?.first_name || "لاعب تيليجرام";
        const defaultPhoto = "https://upload.wikimedia.org/wikipedia/commons/7/7c/Profile_avatar_placeholder_large.png";
        const userPhoto = tg.initDataUnsafe?.user?.photo_url || defaultPhoto;

        const moveSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/move-self.mp3');
        const captureSound = new Audio('https://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/capture.mp3');

        let board = null;
        let game = new Chess();
        
        let roomId = null;
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.has('room')) roomId = urlParams.get('room');
        else if (urlParams.has('startapp')) roomId = urlParams.get('startapp');
        else if (tg.initDataUnsafe?.start_param) roomId = tg.initDataUnsafe.start_param;

        let myRole = 'w';
        let gameRef = null;
        let timerInterval = null;
        let opponentJoined = false;
        
        let localWTime = 0;
        let localBTime = 0;
        let timeLimitGame = 0;
        let dataCache = {};
        
        let selectedTapSquare = null;

        if (roomId) {
            myRole = 'b';
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            initGame(roomId);
        }

        window.startGame = function() {
            let selectedMinutes = parseInt(document.getElementById('time-limit').value);
            roomId = Math.random().toString(36).substring(2, 10);
            myRole = 'w';
            opponentJoined = false;
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            document.getElementById('invite-btn').style.display = 'inline-block';
            
            initGame(roomId, selectedMinutes, userName);
        }

        window.resignGame = function() {
            if (confirm("هل أنت متأكد أنك تريد الاستسلام والانسحاب؟")) {
                update(gameRef, { resigned: myRole });
            }
        }

        function removeHighlights() {
            $('#board .square-55d63').removeClass('yellow-highlight red-highlight error-flash');
            $('#board .square-55d63').find('.highlight-dot, .highlight-capture').remove();
        }

        function highlightKingInCheck() {
            if (game.in_check()) {
                let turn = game.turn();
                $('#board .square-55d63').each(function() {
                    let sq = $(this).attr('data-square');
                    let piece = game.get(sq);
                    if (piece && piece.type === 'k' && piece.color === turn) {
                        $(this).addClass('red-highlight');
                    }
                });
            }
        }

        function showGameOver(title, message) {
            document.getElementById('modal-result-title').innerText = title;
            document.getElementById('modal-result-text').innerText = message;
            document.getElementById('game-over-modal').style.display = 'flex';
        }

        function executeMove(source, target) {
            var move = game.move({ from: source, to: target, promotion: 'q' });
            if (move === null) return false; 
            
            board.position(game.fen(), false);
            if (move.captured) captureSound.play();
            else moveSound.play();

            highlightKingInCheck();
            checkGameStatus();

            set(gameRef, { 
                fen: game.fen(), turn: game.turn(),
                wTime: localWTime, bTime: localBTime,
                wName: dataCache.wName || '', bName: dataCache.bName || '',
                wPhoto: dataCache.wPhoto || '', bPhoto: dataCache.bPhoto || '',
                timeLimit: timeLimitGame,
                resigned: dataCache.resigned || null
            });
            return true;
        }

        function checkGameStatus() {
            if (game.game_over()) {
                clearInterval(timerInterval);
                if (game.in_checkmate()) {
                    let winnerName = game.turn() === 'w' ? (dataCache.bName || 'الأسود') : (dataCache.wName || 'الأبيض');
                    showGameOver("فاز " + winnerName, "بواسطة كش مات 🏆");
                } else {
                    showGameOver("تعادل", "انتهت المباراة بالتعادل 🤝");
                }
                return true;
            }
            return false;
        }

        function startLocalClock() {
            clearInterval(timerInterval);
            if (timeLimitGame <= 0 || dataCache.resigned) return; 

            timerInterval = setInterval(() => {
                if (!opponentJoined || game.game_over() || dataCache.resigned) return;

                if (game.turn() === 'w') {
                    if (localWTime > 0) localWTime--;
                } else {
                    if (localBTime > 0) localBTime--;
                }
                
                updateTimersUI(localWTime, localBTime);
                
                if (localWTime <= 0 || localBTime <= 0) {
                    clearInterval(timerInterval);
                    let winnerName = localWTime <= 0 ? (dataCache.bName || 'الأسود') : (dataCache.wName || 'الأبيض');
                    showGameOver("فاز " + winnerName, "بسبب نفاد الوقت ⏱️");
                }
            }, 1000);
        }

        function initGame(id, minutes = 0, creatorName = "") {
            gameRef = ref(db, 'rooms/' + id);
            
            if (myRole === 'w') {
                $('#my-info').addClass('player-white').removeClass('player-black');
                $('#opponent-info').addClass('player-black').removeClass('player-white');
            } else {
                $('#my-info').addClass('player-black').removeClass('player-white');
                $('#opponent-info').addClass('player-white').removeClass('player-black');
            }

            document.getElementById('my-name').innerText = userName;
            document.getElementById('my-photo').src = userPhoto;
            
            if (myRole === 'w') {
                let seconds = minutes * 60;
                set(gameRef, { 
                    fen: game.fen(), 
                    timeLimit: seconds,
                    wTime: seconds, bTime: seconds,
                    wName: creatorName, wPhoto: userPhoto,
                    turn: 'w', resigned: null
                });
            } else {
                update(gameRef, { bName: userName, bPhoto: userPhoto });
            }

            var config = {
                position: 'start',
                draggable: true,
                dropOffBoard: 'snapback', 
                moveSpeed: 100,           
                snapbackSpeed: 100,       
                snapSpeed: 100,
                pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
                orientation: myRole === 'b' ? 'black' : 'white',
                onDragStart: function(source, piece) {
                    if (!opponentJoined || game.game_over() || dataCache.resigned) return false;
                    
                    if (piece.search(myRole === 'w' ? /^b/ : /^w/) !== -1) return false;

                    removeHighlights();
                    selectedTapSquare = source;
                    $('#board .square-' + source).addClass('yellow-highlight');

                    var moves = game.moves({ square: source, verbose: true });
                    for (var i = 0; i < moves.length; i++) {
                        var isCapture = game.get(moves[i].to) !== null;
                        var $sq = $('#board .square-' + moves[i].to);
                        $sq.append(`<div class="${isCapture ? 'highlight-capture' : 'highlight-dot'}"></div>`);
                    }
                },
                onDrop: function(source, target) {
                    removeHighlights();
                    
                    if (game.turn() !== myRole) {
                        let $sq = $('#board .square-' + source);
                        $sq.addClass('error-flash');
                        setTimeout(() => $sq.removeClass('error-flash'), 250);
                        selectedTapSquare = null;
                        return 'snapback';
                    }

                    let success = executeMove(source, target);
                    if (!success) {
                        selectedTapSquare = null;
                        return 'snapback';
                    }
                    selectedTapSquare = null;
                }
            };
            board = Chessboard('board', config);

            // اللعب عن طريق اللمس (Tap-to-Move)
            $('#board').on('click', '.square-55d63', function() {
                if (!opponentJoined || game.game_over() || dataCache.resigned) return;
                var clickedSquare = $(this).attr('data-square');
                
                if (selectedTapSquare && selectedTapSquare !== clickedSquare && game.turn() === myRole) {
                    let success = executeMove(selectedTapSquare, clickedSquare);
                    if (success) {
                        removeHighlights();
                        selectedTapSquare = null;
                        return;
                    }
                }
                
                var piece = game.get(clickedSquare);
                if (piece && piece.color === myRole) {
                    removeHighlights();
                    selectedTapSquare = clickedSquare;
                    $(this).addClass('yellow-highlight');
                    var moves = game.moves({ square: clickedSquare, verbose: true });
                    for (var i = 0; i < moves.length; i++) {
                        var isCapture = game.get(moves[i].to) !== null;
                        var $sq = $('#board .square-' + moves[i].to);
                        $sq.append(`<div class="${isCapture ? 'highlight-capture' : 'highlight-dot'}"></div>`);
                    }
                }
            });

            onValue(gameRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    dataCache = data;
                    timeLimitGame = data.timeLimit;
                    
                    if (data.resigned) {
                        clearInterval(timerInterval);
                        let winnerName = data.resigned === 'w' ? (data.bName || 'الأسود') : (data.wName || 'الأبيض');
                        
                        $('#board .square-55d63').each(function() {
                            let sq = $(this).attr('data-square');
                            let piece = game.get(sq);
                            if (piece && piece.type === 'k' && piece.color === data.resigned) {
                                if ($(this).find('.surrender-flag').length === 0) {
                                    $(this).append('<div class="surrender-flag">🏳️</div>');
                                }
                            }
                        });
                        
                        setTimeout(() => showGameOver("فاز " + winnerName, "بسبب انسحاب الخصم 🏳️"), 1000);
                        return;
                    }

                    if (data.fen !== game.fen()) {
                        game.load(data.fen);
                        board.position(data.fen);
                        moveSound.play();
                        removeHighlights();
                        highlightKingInCheck();
                        checkGameStatus();
                        
                        localWTime = data.wTime;
                        localBTime = data.bTime;
                    } else if (localWTime === 0 && localBTime === 0 && data.timeLimit > 0) {
                        localWTime = data.wTime;
                        localBTime = data.bTime;
                    }
                    
                    updateTimersUI(localWTime, localBTime);
                    
                    if (data.wName && data.bName) {
                        if (!opponentJoined) {
                            opponentJoined = true;
                            $('#game-status').text('بدأت المعركة! ⚔️');
                            $('#invite-btn').hide();
                            $('#resign-btn').show(); 
                            startLocalClock(); 
                        }
                        
                        let oppName = myRole === 'w' ? data.bName : data.wName;
                        let oppPhoto = myRole === 'w' ? data.bPhoto : data.wPhoto;
                        
                        $('#opponent-name').text(oppName);
                        if(oppPhoto) $('#opponent-photo').attr('src', oppPhoto);
                    }
                }
            });
        }

        function updateTimersUI(wTime, bTime) {
            if (timeLimitGame <= 0) {
                $('#my-timer').text('--:--');
                $('#opponent-timer').text('--:--');
                return;
            }
            function format(sec) {
                if (sec < 0) sec = 0;
                let m = Math.floor(sec / 60), s = sec % 60;
                return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
            }
            
            if (myRole === 'w') {
                document.getElementById('my-timer').innerText = format(wTime);
                document.getElementById('opponent-timer').innerText = format(bTime);
            } else {
                document.getElementById('my-timer').innerText = format(bTime);
                document.getElementById('opponent-timer').innerText = format(wTime);
            }
        }

        window.inviteFriend = function() {
            let gameUrl = `https://diaaldin12015-png.github.io/chess/?room=${roomId}`;
            let shareUrl = `https://t.me/share/url?url=${encodeURIComponent(gameUrl)}&text=أتحداك في جيم شطرنج احترافي! ادخل العب معي الآن ♟️`;
            tg.openTelegramLink(shareUrl);
        }
    </script>
</body>
</html>
